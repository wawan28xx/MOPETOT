<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mobile Audit Tool{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">
                <span class="logo">&#9760;</span> Mobile Audit Tool
            </a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/upload" class="nav-link">Upload</a>
            <a href="/history" class="nav-link">History</a>
            <a href="/compare" class="nav-link">Compare</a>
        </div>
        <div class="nav-search">
            <input type="text" id="global-search" placeholder="Search findings..." 
                   hx-get="/api/search"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#search-results"
                   hx-vals="js:{q: document.getElementById('global-search').value}">
        </div>
    </nav>

    <div id="search-results" class="search-dropdown" style="display:none;"></div>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Mobile Audit Tool v1.0 | Built for Bug Bounty Hunters</p>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>

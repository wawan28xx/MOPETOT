name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r web/requirements.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          mobile_audit.py apkid_wrapper.py secret_scanner.py engines web

      - name: Smoke test web application
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app:app --app-dir web --host 127.0.0.1 --port 8089 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8089/api/scans?per_page=5 >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi
            sleep 1
          done

          echo "Application did not become ready in time" >&2
          exit 1

  container:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag mopenot:ci .

      - name: Run container health check
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name mopenot-ci mopenot:ci
          trap 'docker logs mopenot-ci || true; docker rm --force --volumes mopenot-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' mopenot-ci)
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              echo "Container became unhealthy" >&2
              exit 1
            fi
            sleep 2
          done

          echo "Container did not become healthy in time" >&2
          exit 1

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push'
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
